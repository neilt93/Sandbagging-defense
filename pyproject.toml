[project]
name = "sandbagging-defense"
version = "0.1.0"
description = "Structure-preference probing as a sandbagging-resistant capability evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pybdm>=0.1.0",
    "music21>=9.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "vllm>=0.5",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbagging_defense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that scan the music21 Bach corpus (may take several seconds)",
]
